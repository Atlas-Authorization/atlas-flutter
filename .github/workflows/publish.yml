name: publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
      - name: Tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')" = "${GITHUB_REF_NAME}"
      - run: flutter pub get
      - run: flutter test
      - name: Publish to pub.dev
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          mkdir -p "$HOME/.config/dart"
          printf '%s' "$PUB_CREDENTIALS" > "$HOME/.config/dart/pub-credentials.json"
          flutter pub publish --force
          rm -f "$HOME/.config/dart/pub-credentials.json"
